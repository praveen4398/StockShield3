[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stockshield"
version = "2.0.0"
description = "Institutional Multi-Agent Stock Analysis and Risk Intelligence"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "StockShield Research Group" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "google-adk>=2.13.0",
    "crewai>=1.15.0",
    "mcp>=1.30.0",
    "yfinance>=1.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "statsmodels>=0.14.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "google-genai>=2.34.0",
    "a2a-sdk>=1.3.0",
    "truststore>=0.10.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live_news: marks tests that make live network calls to retrieve real news",
]
filterwarnings = [
    "ignore::DeprecationWarning:crewai.*",
    "ignore::pytest.PytestDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
