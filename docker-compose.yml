version: '3.8'

services:
  stockshield-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATA_PROVIDER_MODE=fixture
      - LLM_PROVIDER=stub
      - DEFAULT_WORKFLOW=sequential
      - ENABLE_CALLBACKS=true
      - ENABLE_GUARDRAILS=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
